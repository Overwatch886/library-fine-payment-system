<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | UI Library</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="page-header">
    <h1>Admin Dashboard</h1>
    <nav>
        <a href="/logout.php">Logout</a>
    </nav>
</header>

<main class="catalogue-page">

    <!-- ===== Stats ===== -->
    <section class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Total Books</span>
            <span class="stat-value" id="stat-total-books">–</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Copies Out</span>
            <span class="stat-value" id="stat-copies-out">–</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Overdue Loans</span>
            <span class="stat-value" id="stat-overdue-loans">–</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Unpaid Fines</span>
            <span class="stat-value" id="stat-unpaid-fines-count">–</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Unpaid Total</span>
            <span class="stat-value" id="stat-unpaid-fines-total">–</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Collected</span>
            <span class="stat-value" id="stat-payments-collected">–</span>
        </div>
    </section>

    <!-- ===== Loans Table ===== -->
    <section class="panel">
        <h2>Loans</h2>

        <div class="search-controls">
            <input type="text" id="loan-search" class="search-box" placeholder="Search title or student…">
            <select id="loan-status" class="category-filter">
                <option value="">All</option>
                <option value="active">Active</option>
                <option value="overdue">Overdue</option>
                <option value="returned">Returned</option>
            </select>
            <button class="buttons" id="loan-filter-btn">Filter</button>
        </div>

        <table class="loans-table" id="loans-table">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Matric</th>
                    <th>Book</th>
                    <th>Borrowed</th>
                    <th>Due</th>
                    <th>Returned</th>
                    <th>Status</th>
                    <th>Fine</th>
                </tr>
            </thead>
            <tbody id="loans-tbody">
                <tr><td colspan="8" class="results-placeholder">Loading…</td></tr>
            </tbody>
        </table>
    </section>

</main>

<script>
const API = '/api';

/** Fetch a JSON endpoint and return the parsed body. */
async function fetchJson(url, options = {}) {
    const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
    });
    return res.json();
}

/** Populate the stat cards from /admin/stats.php */
async function loadStats() {
    try {
        const json = await fetchJson(`${API}/admin/stats.php`);
        if (!json.success) return;
        const d = json.data;
        // TODO: set each stat-value element's textContent from d
        // e.g. document.getElementById('stat-total-books').textContent = d.total_books;
    } catch (err) {
        console.error('Stats failed:', err);
    }
}

/** Load and render the loans table. Reads filter inputs. */
async function loadLoans() {
    const status = document.getElementById('loan-status').value;
    const q = document.getElementById('loan-search').value.trim();

    const params = new URLSearchParams();
    if (status) params.set('status', status);
    if (q) params.set('q', q);

    try {
        const json = await fetchJson(`${API}/admin/loans.php?${params.toString()}`);
        if (!json.success) return;

        const tbody = document.getElementById('loans-tbody');
        const loans = json.data;

        if (!loans.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="results-placeholder">No loans found.</td></tr>';
            return;
        }

        // TODO: build <tr> rows from each loan object
        // Fields available: student_name, matric_number, book_title,
        //   borrow_date, due_date, return_date, is_overdue, days_overdue,
        //   fine_amount, fine_status, fine_so_far
    } catch (err) {
        console.error('Loans failed:', err);
    }
}

// Wire up the filter button
document.getElementById('loan-filter-btn').addEventListener('click', loadLoans);

// Initial load
loadStats();
loadLoans();
</script>

</body>
</html>
